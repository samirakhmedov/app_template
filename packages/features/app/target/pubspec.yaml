name: app_target
description: "Shared app-target composition root: IAppScope, AppScopeContainer, App widget."
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: 3.11.1
  flutter: 3.41.4

dependencies:
  # DI infrastructure
  app_di:
  di_core:
  # App architecture
  app_domain:
  app_data:
  app_presentation:
  app_assets:
  app_router:
  # Common feature
  common_domain:
  common_data:
  common_presentation:
  # Theme
  theme_domain:
  theme_data:
  theme_presentation:
  # Debug (data layer only — no debug UI)
  debug_domain:
  debug_data:
  # Device settings
  device_settings_domain:
  device_settings_data:
  device_settings_presentation:
  # Haptics
  haptics_di:
  haptics_domain:
  haptics_data:
  haptics_presentation:
  # Splash
  splash_di:
  # Infrastructure
  core:
  database:
  network:
  storage:
  uikit:
  # Flutter
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Third-party
  auto_route: 10.1.0+1
  bloc: 9.0.0
  flutter_bloc: 9.1.1
  flutter_easy_dialogs: 4.0.3
  flutter_displaymode: 0.6.0
  freezed_annotation: 3.0.0
  intl: 0.20.2
  provider: 6.1.5
  vector_graphics: 1.1.19
  yx_scope: 1.0.2
