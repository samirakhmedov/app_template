name: app_assets
description: "App shared assets — vectors, shaders, and localizations."
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: 3.11.0
  flutter: 3.41.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: 2.5.4

flutter:
  generate: true
  assets:
    - assets/resources/vectors/
  shaders:
    - assets/shaders/shimmer.frag

flutter_gen:
  output: lib/generated/
  line_length: 100
  assets:
    outputs:
      package_parameter_enabled: true
