ext {
    def huaweiKeystorePropsFile = rootProject.file("keystore/keystore_huawei.properties")
    if (huaweiKeystorePropsFile.exists()) {
        println "Start extract release keystore app_config.dart from keystore_huawei.properties"
        def huaweiKeystoreProps = new Properties()
        huaweiKeystoreProps.load(new FileInputStream(huaweiKeystorePropsFile))
        huaweiKeystoreConfig = [
                storePassword: huaweiKeystoreProps['storePassword'],
                keyPassword  : huaweiKeystoreProps['keyPassword'],
                keyAlias     : huaweiKeystoreProps['keyAlias'],
                storeFile    : huaweiKeystoreProps['storeFile']
        ]
    } else {
        println "Start extract release keystore app_config.dart from global vars"
        huaweiKeystoreConfig = [
                storePassword: System.getenv('storePassword'),
                keyPassword  : System.getenv('keyPassword'),
                keyAlias     : System.getenv('keyAlias'),
                storeFile    : System.getenv('storeFile')
        ]
    }
    if (!huaweiKeystoreConfig.storeFile) {
        huaweiKeystoreConfig.storeFile = "no_keystore_file" //fix crash file(storeFile)
    }
    println "Extracted keystore app_config.dart: $huaweiKeystoreConfig"
}