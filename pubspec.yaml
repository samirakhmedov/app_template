name: app_template
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: 3.11.1
  flutter: 3.41.4

dependencies:
  # analytics_interface: 
  # analytics_gms: 
  # analytics_hms: 
  # push_interface: 
  # push_gms: 
  # push_hms: 
  # location_interface: 
  # location_gms: 
  # location_hms: 
  api:
  async: ^2.13.0
  app_assets:
  auto_route: 10.1.0+1
  bloc: 9.0.0
  bloc_concurrency: 0.3.0
  collection: 1.19.1
  database:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_easy_dialogs: 4.0.3
  flutter_displaymode: 0.6.0
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.0.0
  haptics:
    git: https://github.com/samirakhmedov/haptics.git
  intl: 0.20.2
  network:
  provider: 6.1.5
  storage:
  uikit:
  vector_graphics: 1.1.19
  yx_scope: 1.0.2

workspace:
  - packages/core
  - packages/util
  - packages/data/analytics/gms
  - packages/data/analytics/hms
  - packages/data/analytics/interface
  - packages/data/api
  - packages/data/database
  - packages/features/app/assets
  - packages/features/app/data
  - packages/features/app/domain
  - packages/features/app/presentation
  - packages/features/app/di/core
  - packages/features/app/di/gms
  - packages/features/app/di/hms
  - packages/features/app/router
  - packages/features/device_settings/data
  - packages/features/device_settings/domain
  - packages/features/device_settings/presentation
  - packages/features/common/data
  - packages/features/common/domain
  - packages/features/common/presentation
  - packages/features/theme/data
  - packages/features/theme/domain
  - packages/features/theme/presentation
  - packages/features/splash/data
  - packages/features/splash/domain
  - packages/features/splash/di
  - packages/features/splash/presentation
  - packages/features/debug/data
  - packages/features/debug/di
  - packages/features/debug/di_stub
  - packages/features/debug/domain
  - packages/features/debug/presentation
  - packages/features/debug/presentation_stub
  - packages/features/haptics/data
  - packages/features/haptics/di
  - packages/features/haptics/domain
  - packages/features/haptics/presentation
  - packages/data/location/gms
  - packages/data/location/hms
  - packages/data/location/interface
  - packages/data/network
  - packages/data/push/gms
  - packages/data/push/hms
  - packages/data/push/interface
  - packages/data/storage
  - packages/uikit

dev_dependencies:
  build_runner: 2.5.4
  flutter_test:
    sdk: flutter
  freezed: 3.0.6
  mocktail: 1.0.4
  melos: 6.3.3
  surf_dcm_presets: 0.1.1
  surf_lint_rules: 4.0.0
  surf_widget_test_composer: 0.0.6
  vector_graphics_compiler: 1.1.17

flutter:
  generate: true
  default-flavor: prodGms
  uses-material-design: false

